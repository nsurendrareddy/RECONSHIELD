services:
  # Backend Web Service (FastAPI)
  - type: web
    name: reconshield-api
    runtime: python
    buildCommand: cd server && pip install -r requirements.txt
    startCommand: cd server && gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: MONGO_URI
        sync: false # Set this in Render Dashboard
      - key: MONGO_DB_NAME
        value: reconshield
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          type: static
          name: reconshield-web
          property: host
      - key: JWT_SECRET
        generateValue: true

  # Frontend Static Site (Vite/React)
  - type: static
    name: reconshield-web
    runtime: node
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: reconshield-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
