services:
  # Backend Web Service (FastAPI)
  - type: web
    name: reconshield-api
    runtime: python
    buildCommand: cd server && pip install -r requirements.txt
    startCommand: cd server && gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: MONGO_URI
        sync: false # Set this in Render Dashboard
      - key: MONGO_DB_NAME
        value: reconshield
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false # Set this to your production URL (e.g., https://reconshield.in)
      - key: JWT_SECRET
        generateValue: true

